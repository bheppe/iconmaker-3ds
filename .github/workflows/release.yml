name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: read

jobs:
  # The app shows ICONMAKER_VERSION and the CIA carries the version from the
  # build script, so a tag that disagrees with either ships a build that
  # misreports itself. Checked first, so a mismatch fails before anything is uploaded.
  version:
    name: Version Check
    # The nightly pre-release is CI's (ci.yml), not a version
    if: github.event.release.tag_name != 'nightly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag matches the sources
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(sed -n 's/^#define[[:space:]]*ICONMAKER_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' source/main.c)"
          cia="$(sed -n 's/.*-major \([0-9]*\) -minor \([0-9]*\) -micro \([0-9]*\).*/\1.\2.\3/p' build-iconmaker.sh)"
          echo "release tag:               $tag (${GITHUB_REF_NAME})"
          echo "main.c ICONMAKER_VERSION:  ${app:-<not found>}"
          echo "build-iconmaker.sh CIA:    ${cia:-<not found>}"
          fail=0
          if [ "$app" != "$tag" ]; then
            echo "::error file=source/main.c::ICONMAKER_VERSION \"$app\" does not match tag ${GITHUB_REF_NAME}."
            fail=1
          fi
          if [ "$cia" != "$tag" ]; then
            echo "::error file=build-iconmaker.sh::makerom -major/-minor/-micro ($cia) does not match tag ${GITHUB_REF_NAME}."
            fail=1
          fi
          exit $fail

  build-and-upload:
    name: Build and Upload
    needs: version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      DL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build image
        # The image of this commit's Dockerfile, as in ci.yml
        run: |
          image="$(bash docker/build-image.sh --pull)"
          echo "BUILD_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace "$BUILD_IMAGE" \
            bash docker/ci-build.sh
          sudo chown -R "$USER" .

      # The same names as in gpSP 3D's releases before the split (iconmaker.cia,
      # iconmaker.3dsx), so releases/latest/download links and the store keep working
      - name: Upload release assets
        run: |
          gh release upload "$TAG" --clobber out/iconmaker.cia out/iconmaker.3dsx

      - name: FBI install QR code
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qrencode
          # FBI's "Scan QR Code" remote install expects the plain URL of the .cia
          qrencode -o iconmaker-QR.png -s 8 -m 3 -l M "$DL/iconmaker.cia"
          gh release upload "$TAG" --clobber iconmaker-QR.png

      - name: Add the QR code to the release notes
        run: |
          # Drop a block from an earlier run, so re-runs replace it instead of stacking
          gh release view "$TAG" --json body -q .body > body.md
          sed -n '/<!-- iconmaker-qr:start -->/q;p' body.md > notes.md
          # Command substitution drops trailing newlines, so re-runs don't add blank lines
          printf '%s\n' "$(cat notes.md)" > notes.md
          {
            echo
            echo '<!-- iconmaker-qr:start -->'
            echo '## Install on your 3DS'
            echo
            echo 'Open **FBI** -> **Remote Install** -> **Scan QR Code**, then scan:'
            echo
            echo "<img src=\"$DL/iconmaker-QR.png\" alt=\"QR code to install Icon Maker $TAG with FBI\" width=\"220\">"
            echo
            echo "[\`iconmaker.cia\`]($DL/iconmaker.cia)"
            echo '<!-- iconmaker-qr:end -->'
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
